<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <base href="/nimbus/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f3" />
    <title>Nimbus — the live weather of a digital school</title>
    <meta
      name="description"
      content="Nimbus is an instrumented overlay on the Open Provision Drawings: the live instrument reading of one provision's architecture. It monitors the institution, never the child."
    />

    <!-- Force fresh HTML when we deploy a new build -->
    <script>
      (function enforceVersion() {
        const VERSION = "5"; // bump this on each deploy
        const h = window.location.hostname;
        if (h === "localhost" || h === "127.0.0.1") return;
        const p = new URL(window.location.href);
        if (p.searchParams.get("v") !== VERSION) {
          p.searchParams.set("v", VERSION);
          // Avoid history junk; also defeats CDN and browser caches for HTML
          window.location.replace(p.toString());
        }
      })();
    </script>

    <!-- Cache hints (HTML only; assets are hashed by Vite) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/svg+xml" href="/nimbus/vite.svg" />

    <!-- Fraunces + Inter — the same pairing as the OAP plates -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- Hard fallback: paper and ink, even if the stylesheet fails -->
    <style>
      html, body, #root { min-height: 100%; }
      body {
        margin: 0;
        background: #faf8f3;
        color: #1d1a2e;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
    <script type="module" crossorigin src="/nimbus/assets/index-BYl5gzPS.js"></script>
    <link rel="stylesheet" crossorigin href="/nimbus/assets/index-C5safLsO.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
